<g id="frontend-window" data-pptx-bounds="50 110 930 520"><rect x="50" y="110" width="930" height="520" rx="10" fill="#FFFFFF" stroke="#CCD7E3"/><rect x="50" y="110" width="930" height="36" rx="10" fill="#EAF0F7" stroke="none"/><text x="68" y="135" font-family="Arial" font-size="15" fill="#64748B" font-weight="normal">●  ●  ●</text><text x="145" y="135" font-family="Arial" font-size="17" fill="#64748B" font-weight="normal">OCS Standards Assistant / planned Streamlit interface</text><rect x="51" y="147" width="200" height="482" rx="0" fill="#F1F5F9" stroke="none"/><text x="70" y="185" font-family="Arial" font-size="23" fill="#194B8C" font-weight="bold">Query settings</text><text x="70" y="220" font-family="Arial" font-size="18" fill="#64748B" font-weight="normal">Standard family</text><rect x="68" y="232" width="165" height="46" rx="5" fill="#FFFFFF" stroke="#CBD5E1"/><text x="80" y="262" font-family="Arial" font-size="20" fill="#23364B" font-weight="normal">Standard S</text><text x="70" y="310" font-family="Arial" font-size="18" fill="#64748B" font-weight="normal">Requested edition</text><rect x="68" y="322" width="165" height="46" rx="5" fill="#FFFFFF" stroke="#CBD5E1"/><text x="80" y="352" font-family="Arial" font-size="20" fill="#23364B" font-weight="normal">Edition A</text><text x="70" y="400" font-family="Arial" font-size="18" fill="#64748B" font-weight="normal">Retrieval</text><rect x="68" y="412" width="165" height="46" rx="5" fill="#FFFFFF" stroke="#CBD5E1"/><text x="80" y="442" font-family="Arial" font-size="20" fill="#23364B" font-weight="normal">Hybrid</text><text x="70" y="520" font-family="Arial" font-size="17" fill="#64748B" font-weight="normal">Learning and</text><text x="70" y="545" font-family="Arial" font-size="17" fill="#64748B" font-weight="normal">consultation only</text><text x="278" y="188" font-family="Arial" font-size="26" fill="#194B8C" font-weight="bold">Ask the permitted documents</text><rect x="276" y="213" width="676" height="72" rx="8" fill="#EAF1FA" stroke="none"/><text x="295" y="244" font-family="Arial" font-size="22" fill="#23364B" font-weight="normal">Which test requirements apply to fitting X</text><text x="295" y="272" font-family="Arial" font-size="22" fill="#23364B" font-weight="normal">in edition A?</text><rect x="276" y="308" width="676" height="172" rx="8" fill="#F4FAF9" stroke="none"/><text x="296" y="344" font-family="Arial" font-size="25" fill="#178783" font-weight="bold">Answer with evidence [1]</text><text x="296" y="383" font-family="Arial" font-size="22" fill="#23364B" font-weight="normal">A requirement summary would appear here.</text><text x="296" y="418" font-family="Arial" font-size="22" fill="#23364B" font-weight="normal">Each factual claim links to its source.</text><text x="296" y="455" font-family="Arial" font-size="18" fill="#64748B" font-weight="normal">No actual standard clause is reproduced.</text><rect x="276" y="501" width="676" height="57" rx="6" fill="#FFFFFF" stroke="#B4CED0"/><text x="294" y="537" font-family="Arial" font-size="21" fill="#178783" font-weight="bold">[1] Standard S · Edition A · source location</text><rect x="276" y="577" width="676" height="37" rx="5" fill="#FFFFFF" stroke="#CBD5E1"/><text x="295" y="603" font-family="Arial" font-size="19" fill="#64748B" font-weight="normal">Ask a follow-up question…</text></g><g id="usage-steps" data-pptx-bounds="1008 145 230 470"><text x="1010" y="174" font-family="Arial" font-size="22" fill="#194B8C" font-weight="bold">1  SET EDITION</text><text x="1010" y="213" font-family="Arial" font-size="20" fill="#23364B" font-weight="normal">Keep the requested</text><text x="1010" y="241" font-family="Arial" font-size="20" fill="#23364B" font-weight="normal">document context.</text><text x="1010" y="333" font-family="Arial" font-size="22" fill="#194B8C" font-weight="bold">2  ASK</text><text x="1010" y="372" font-family="Arial" font-size="20" fill="#23364B" font-weight="normal">Use a practical</text><text x="1010" y="400" font-family="Arial" font-size="20" fill="#23364B" font-weight="normal">document question.</text><text x="1010" y="510" font-family="Arial" font-size="22" fill="#178783" font-weight="bold">3  CHECK SOURCE</text><text x="1010" y="549" font-family="Arial" font-size="20" fill="#23364B" font-weight="normal">Open the citation</text><text x="1010" y="577" font-family="Arial" font-size="20" fill="#23364B" font-weight="normal">and inspect evidence.</text></g></svg>