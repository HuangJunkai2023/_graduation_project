<text x="86.67" y="44.0" text-anchor="start" xml:space="preserve" font-size="36.0" fill="#FFFFFF" font-weight="bold">Observed findings for the three questions</text></g>
<g data-pptx-bounds="54 682 1181 19.5" id="content-13-005"><text x="54" y="695" font-family="Arial" font-size="13" fill="#64748B" font-weight="normal">Frozen OCS study | Review against original sources</text></g><g data-pptx-bounds="65 121 1170 43.5" id="content-13-006"><text x="65" y="150" font-family="Arial" font-size="29" fill="#194B8C" font-weight="bold">RQ1  Retrieval</text></g><g data-pptx-bounds="65 178 1170 40.5" id="content-13-007"><text x="65" y="205" font-family="Arial" font-size="27" fill="#23364B" font-weight="normal">Recall@5  B1 96.9% · B2 76.6% · B3 95.3%</text></g><g data-pptx-bounds="65 228 1170 33.0" id="content-13-008"><text x="65" y="250" font-family="Arial" font-size="22" fill="#64748B" font-weight="normal">BM25 is the best-supported default for this corpus. Hybrid remains selectable.</text></g><g data-pptx-bounds="65 276 1170 43.5" id="content-13-009"><text x="65" y="305" font-family="Arial" font-size="29" fill="#194B8C" font-weight="bold">RQ2  Editions</text></g><g data-pptx-bounds="65 333 1170 40.5" id="content-13-010"><text x="65" y="360" font-family="Arial" font-size="27" fill="#23364B" font-weight="normal">Wrong-edition rate  B3 0.0% · A1 0.0%</text></g><g data-pptx-bounds="65 383 1170 33.0" id="content-13-011"><text x="65" y="405" font-family="Arial" font-size="22" fill="#64748B" font-weight="normal">No observed reduction in wrong editions in this limited comparison.</text></g><g data-pptx-bounds="65 431 1170 43.5" id="content-13-012"><text x="65" y="460" font-family="Arial" font-size="29" fill="#194B8C" font-weight="bold">RQ3  Evidence Gate</text></g><g data-pptx-bounds="65 488 1170 40.5" id="content-13-013"><text x="65" y="515" font-family="Arial" font-size="27" fill="#23364B" font-weight="normal">Unsupported answers  B3 1/80 · A2 1/80</text></g><g data-pptx-bounds="65 538 1170 33.0" id="content-13-014"><text x="65" y="560" font-family="Arial" font-size="22" fill="#64748B" font-weight="normal">The test showed the same unsupported-answer and refusal rates.</text></g><g data-pptx-bounds="65 624 1170 31.5" id="content-13-015"><text x="65" y="645" font-family="Arial" font-size="21" fill="#64748B" font-weight="normal">Interpretation is limited to this corpus, benchmark and assistant-reviewed scoring protocol.</text></g></svg>