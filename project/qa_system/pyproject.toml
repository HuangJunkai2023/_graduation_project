[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocs-qa"
version = "0.1.0"
description = "Traceable overhead contact system document QA"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pymupdf>=1.24", "python-docx>=1.1", "python-dotenv>=1.0", "httpx>=0.27,<1", "streamlit>=1.40,<2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ocs-qa = "ocs_qa.cli:main"

[tool.setuptools.packages.find]
include = ["ocs_qa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
